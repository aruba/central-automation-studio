	<script type="text/javascript">
	$(document).ready(function() {	
		getCASVersion();
		openIndexedDB();
		
		var reachabilityPromise = new $.Deferred();
		$.when(checkReachability(reachabilityPromise)).then(function () {
			var previousWLAN = localStorage.getItem('filter_client_ssid');
			if (previousWLAN != null && previousWLAN != "undefined") {
				selectedWLAN = previousWLAN;
			} else {
				selectedWLAN = '_all';
			}
			
			var previousSite = localStorage.getItem('filter_client_site');
			if (previousSite != null && previousSite != "undefined") {
				selectedSite = previousSite;
			} else {
				selectedSite = '_all';
			}
			
			// Reload the WLAN list until the WLAN list can be pulled again
			var networks = [];
			var wlanList = localStorage.getItem('networks');
			if (wlanList != null && wlanList != "undefined") networks = JSON.parse(wlanList);
			for (var i = 0; i < networks.length; i++) {
				$('#client-wlanselector').append($('<option>', { value: networks[i]['essid'], text: networks[i]['essid'] }));
				if ($('#client-wlanselector').length != 0) {
					$('#client-wlanselector').selectpicker('refresh');
				}
			}
			if (selectedWLAN) $('#client-wlanselector').selectpicker('val', selectedWLAN);
			
			// Check if we need to get the latest data - or can we just load it from localStorage
			var refreshrate = localStorage.getItem('refresh_rate');
			if (refreshrate === null || refreshrate === "") {
				refreshrate = "30";
			}
			loadMonitoringData(refreshrate);
			
			var loadIntervalID;
			loadIntervalID = setInterval(getMonitoringData, parseInt(refreshrate)*60000);
			
			document.addEventListener("visibilitychange", function handleVisibilityChange() {
			  if (!document.hidden) {
				var reachabilityPromise = new $.Deferred();
				$.when(checkReachability(reachabilityPromise)).then(function () {
					loadIntervalID = setInterval(getMonitoringData, parseInt(refreshrate)*60000);
				});
			  } else {
				clearInterval(loadIntervalID);
			  }
			}, false);
				
			var rollingState = localStorage.getItem('atm_rolling');
			if (rollingState === null || rollingState === "") {
				rollingState = true;
			} else {
				rollingState = JSON.parse(rollingState)
			}
			var rollingrate = localStorage.getItem('atm_rollingrate');
			if (rollingrate === null || rollingrate === "") {
				rollingrate = "60";
			}
			
			if (rollingState) {
				setInterval(rollPage, parseInt(rollingrate)*1000);
			}
		});
	});
	
	function rollPage() {
		if (isAuthInProgress()) setInterval(rollPage, 10000);
		else {
			var pageName = location.pathname.split("/").slice(-1);
			pageName = pageName[0].replace('.html','')
			var nextPage = pageOrder.indexOf(pageName)+1;
			if (nextPage >= pageOrder.length) nextPage = 0;
			window.location.href = window.location.href.substr(0, location.href.lastIndexOf('/') + 1) + pageOrder[nextPage] +'.html';
		}
	}
	</script>
